<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منيو مطعم مارشال - ركن الشاورما والجريل</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Cairo) -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #0b0f19;
            color: #f8fafc;
        }
        .gold-gradient {
            background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
        }
        .hero-bg {
            background: linear-gradient(to bottom, rgba(11, 15, 25, 0.6), rgba(11, 15, 25, 0.95)),
                        url('https://images.unsplash.com/photo-1529006557810-274b9b2fc783?auto=format&fit=crop&w=1200&q=80');
            background-size: cover;
            background-position: center;
        }
        /* Hide scrollbar for category tabs */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="pb-16">

    <!-- Header Hero Section with Shawarma Skewer Background -->
    <header class="hero-bg relative border-b border-amber-500/20 pt-8 pb-10 px-4 text-center shadow-2xl">
        <div class="max-w-4xl mx-auto flex flex-col items-center">
            <!-- Restaurant Logo / Icon -->
            <div class="w-20 h-20 rounded-full gold-gradient flex items-center justify-center text-slate-950 text-4xl font-black shadow-2xl ring-4 ring-amber-500/30 mb-3">
                <i class="fa-solid fa-fire-flame-curled"></i>
            </div>
            <h1 class="text-3xl md:text-4xl font-black text-amber-400 tracking-wide drop-shadow-md">مطعم مارشال</h1>
            <p class="text-sm md:text-base text-slate-300 font-bold mt-1 bg-slate-900/80 px-4 py-1 rounded-full border border-amber-500/30 backdrop-blur-sm">
                أطعم شاورما وجريل على الأصول 🌯🔥
            </p>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 pt-6">

        <!-- Search Bar -->
        <div class="relative mb-6">
            <i class="fa-solid fa-magnifying-glass absolute right-4 top-1/2 -translate-y-1/2 text-amber-400 text-lg"></i>
            <input type="text" id="search-input" oninput="filterMenu()" placeholder="ابحث عن وجبتك المفضلة..." class="w-full bg-slate-900/90 border border-slate-700/80 rounded-xl py-3.5 pr-11 pl-4 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-amber-500 shadow-lg">
        </div>

        <!-- Sticky Navigation Categories -->
        <nav class="flex overflow-x-auto gap-2 pb-2 mb-8 no-scrollbar text-sm font-bold sticky top-3 z-30 bg-slate-950/90 p-2 rounded-2xl backdrop-blur-md border border-slate-800 shadow-2xl">
            <button onclick="scrollToCategory('shawarma')" class="whitespace-nowrap px-4 py-2.5 rounded-xl bg-slate-800/80 hover:bg-amber-500 hover:text-slate-950 text-slate-200 transition border border-slate-700">ركن الشاورما</button>
            <button onclick="scrollToCategory('grill')" class="whitespace-nowrap px-4 py-2.5 rounded-xl bg-slate-800/80 hover:bg-amber-500 hover:text-slate-950 text-slate-200 transition border border-slate-700">ركن الجريل والسندوتشات</button>
            <button onclick="scrollToCategory('meals')" class="whitespace-nowrap px-4 py-2.5 rounded-xl bg-slate-800/80 hover:bg-amber-500 hover:text-slate-950 text-slate-200 transition border border-slate-700">ركن الوجبات</button>
            <button onclick="scrollToCategory('fries')" class="whitespace-nowrap px-4 py-2.5 rounded-xl bg-slate-800/80 hover:bg-amber-500 hover:text-slate-950 text-slate-200 transition border border-slate-700">البطاطس والباكيت</button>
            <button onclick="scrollToCategory('sauces')" class="whitespace-nowrap px-4 py-2.5 rounded-xl bg-slate-800/80 hover:bg-amber-500 hover:text-slate-950 text-slate-200 transition border border-slate-700">ركن الصوصات</button>
        </nav>

        <!-- Dynamic Menu Container -->
        <div id="menu-container" class="space-y-12"></div>

    </main>

    <script>
        // Data with High Quality Unsplash Images for each section
        const menuData = [
            {
                id: 'shawarma',
                title: 'ركن الشاورما',
                icon: 'fa-drumstick-bite',
                image: 'https://images.unsplash.com/photo-1529006557810-274b9b2fc783?auto=format&fit=crop&w=800&q=80',
                items: [
                    { name: 'شاورما فراخ', price: '120 ج.م' },
                    { name: 'شاورما فراخ مشروم', price: '130 ج.م' },
                    { name: 'شاورما فراخ موزاريلا', price: '130 ج.م' },
                    { name: 'شاورما فراخ بطاطس', price: '125 ج.م' },
                    { name: 'شاورما فراخ ايطاليانو', price: '130 ج.م' }
                ]
            },
            {
                id: 'grill',
                title: 'ركن الجريل والسندوتشات',
                icon: 'fa-burger',
                image: 'https://images.unsplash.com/photo-1550547660-d9450f859349?auto=format&fit=crop&w=800&q=80',
                hasBreadOptions: true,
                items: [
                    { name: 'كرسبي', prices: { 'سوري': '120 ج.م', 'فينو': '130 ج.م', 'تورتيلا': '130 ج.م' } },
                    { name: 'زنجر', prices: { 'سوري': '120 ج.م', 'فينو': '130 ج.م', 'تورتيلا': '130 ج.م' } },
                    { name: 'شيش', prices: { 'سوري': '120 ج.م', 'فينو': '130 ج.م', 'تورتيلا': '130 ج.م' } },
                    { name: 'فاهيتا', prices: { 'سوري': '120 ج.م', 'فينو': '130 ج.م', 'تورتيلا': '130 ج.م' } },
                    { name: 'صدور دجاج مشويه', prices: { 'سوري': '150 ج.م', 'فينو': '160 ج.م', 'تورتيلا': '160 ج.م' } },
                    { name: 'هوت دوج', prices: { 'سوري': '100 ج.م', 'فينو': '110 ج.م', 'تورتيلا': '110 ج.م' } },
                    { name: 'كفته', prices: { 'سوري': '90 ج.م', 'فينو': '100 ج.م' } },
                    { name: 'مشكل لحوم', prices: { 'سوري': '130 ج.م', 'فينو': '140 ج.م', 'تورتيلا': '140 ج.م' } },
                    { name: 'مشكل دجاج', prices: { 'سوري': '130 ج.م', 'فينو': '140 ج.م', 'تورتيلا': '140 ج.م' } },
                    { name: 'سوبر كرانشي', prices: { 'سوري': '130 ج.م', 'فينو': '140 ج.م', 'تورتيلا': '140 ج.م' } },
                    { name: 'برجر لحم فريش (عيش كيزر)', prices: { 'سوري': '130 ج.م' } },
                    { name: 'برجر لحم فريش دوبل (عيش كيزر)', prices: { 'سوري': '180 ج.م' } },
                    { name: 'تويستر زنجر', prices: { 'سوري': '150 ج.م' } },
                    { name: 'تويستر كرسبي', prices: { 'سوري': '150 ج.م' } },
                    { name: 'كاسديا', prices: { 'سوري': '150 ج.م' } }
                ]
            },
            {
                id: 'meals',
                title: 'ركن الوجبات',
                icon: 'fa-utensils',
                image: 'https://images.unsplash.com/photo-1544025162-d76694265947?auto=format&fit=crop&w=800&q=80',
                items: [
                    { name: 'شاورما عربي', price: '160 ج.م' },
                    { name: 'شاورما ماريا', price: '170 ج.م' },
                    { name: 'شاورما تركي', price: '180 ج.م' },
                    { name: 'شاورما ايطالي', price: '180 ج.م' },
                    { name: 'وجبة صدور دجاج', price: '180 ج.م' },
                    { name: 'وجبة شيش طاووق', price: '180 ج.م' }
                ]
            },
            {
                id: 'fries',
                title: 'البطاطس والباكيت',
                icon: 'fa-bowl-food',
                image: 'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?auto=format&fit=crop&w=800&q=80',
                items: [
                    { name: 'ساندوتش فلافل سوري', price: '40 ج.م' },
                    { name: 'سوري عادي', price: '45 ج.م' },
                    { name: 'سوري عادي تشيز', price: '55 ج.م' },
                    { name: 'فينو عادي', price: '70 ج.م' },
                    { name: 'فينو تشيز', price: '80 ج.م' },
                    { name: 'باكيت صغير صوصات', price: '45 ج.م' },
                    { name: 'باكيت كبير صوصات', price: '55 ج.م' },
                    { name: 'باكيت رنش صغير', price: '60 ج.م' },
                    { name: 'باكيت رنش كبير', price: '70 ج.م' },
                    { name: 'باكيت صغير تكساس', price: '60 ج.م' },
                    { name: 'باكيت كبير تكساس', price: '70 ج.م' },
                    { name: 'باكيت زنجر', price: '115 ج.م' },
                    { name: 'باكيت شاورما', price: '110 ج.م' },
                    { name: 'اضافة شيدر', price: '10 ج.م' },
                    { name: 'اضافة موزاريلا', price: '10 ج.م' }
                ]
            },
            {
                id: 'sauces',
                title: 'ركن الصوصات',
                icon: 'fa-jar',
                image: 'https://images.unsplash.com/photo-1472476443507-c7a5948772fc?auto=format&fit=crop&w=800&q=80',
                items: [
                    { name: 'ثوميه', price: '15 ج.م' },
                    { name: 'ثوميه حاره', price: '15 ج.م' },
                    { name: 'طحينه', price: '15 ج.م' },
                    { name: 'صوص حار', price: '10 ج.م' },
                    { name: 'شيدر', price: '15 ج.م' },
                    { name: 'تكساس', price: '15 ج.م' },
                    { name: 'رانشي', price: '15 ج.م' },
                    { name: 'باربيكيو', price: '10 ج.م' }
                ]
            }
        ];

        // Render Menu
        function renderMenu(data = menuData) {
            const container = document.getElementById('menu-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-slate-400 py-16">
                        <i class="fa-solid fa-magnifying-glass text-4xl mb-3 opacity-40"></i>
                        <p class="text-lg">عفواً، لا توجد وجبات تطابق بحثك</p>
                    </div>
                `;
                return;
            }

            data.forEach(cat => {
                let itemsHTML = '';

                cat.items.forEach(item => {
                    if (cat.hasBreadOptions) {
                        const pricesList = Object.entries(item.prices).map(([bread, price]) => `
                            <div class="flex justify-between items-center bg-slate-800/80 px-3 py-1.5 rounded-lg text-xs border border-slate-700/50">
                                <span class="text-slate-300 font-semibold">${bread}</span>
                                <span class="text-amber-400 font-bold">${price}</span>
                            </div>
                        `).join('');

                        itemsHTML += `
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 hover:border-amber-500/30 transition shadow-md flex flex-col justify-between">
                                <h4 class="font-bold text-slate-100 text-lg mb-3 border-b border-slate-800 pb-2">${item.name}</h4>
                                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2">
                                    ${pricesList}
                                </div>
                            </div>
                        `;
                    } else {
                        itemsHTML += `
                            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 flex justify-between items-center hover:border-amber-500/30 transition shadow-md">
                                <h4 class="font-bold text-slate-100 text-base">${item.name}</h4>
                                <span class="text-amber-400 font-black text-base bg-amber-500/10 px-3.5 py-1.5 rounded-xl border border-amber-500/20">${item.price}</span>
                            </div>
                        `;
                    }
                });

                container.innerHTML += `
                    <section id="${cat.id}" class="space-y-4 scroll-mt-28">
                        <!-- Category Header Banner with Image -->
                        <div class="relative h-32 md:h-40 rounded-2xl overflow-hidden border border-slate-800 shadow-xl flex items-end p-4">
                            <img src="${cat.image}" alt="${cat.title}" class="absolute inset-0 w-full h-full object-cover brightness-50">
                            <div class="relative z-10 flex items-center gap-3">
                                <div class="w-10 h-10 rounded-xl gold-gradient flex items-center justify-center text-slate-950 text-xl font-black">
                                    <i class="fa-solid ${cat.icon}"></i>
                                </div>
                                <h3 class="text-2xl font-black text-white drop-shadow-md">${cat.title}</h3>
                            </div>
                        </div>

                        <!-- Items Grid -->
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                            ${itemsHTML}
                        </div>
                    </section>
                `;
            });
        }

        // Smooth Navigation
        function scrollToCategory(id) {
            const section = document.getElementById(id);
            if (section) {
                section.scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Live Search Filter
        function filterMenu() {
            const query = document.getElementById('search-input').value.toLowerCase().trim();
            if (!query) {
                renderMenu();
                return;
            }

            const filtered = menuData.map(cat => {
                const items = cat.items.filter(item => item.name.toLowerCase().includes(query));
                return { ...cat, items };
            }).filter(cat => cat.items.length > 0);

            renderMenu(filtered);
        }

        // Initializing Menu
        renderMenu();
    </script>
</body>
</html>
